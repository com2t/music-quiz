<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>서양음악사 리스닝 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a concert program; a staff-line rule under the header; one question card at a time */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1b2433; --muted:#5d6878; --line:#cfd6df;
  --accent:#28456b; --accent-soft:#e1e8f2; --brass:#9a7428;
  --ok:#1f7a4d; --ok-soft:#e2f2e9; --bad:#b03a33; --bad-soft:#f8e4e2;
  --display:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121822; --surface:#1a2230; --ink:#e6eaf0; --muted:#9aa5b5; --line:#2f3a4b;
  --accent:#8fb0dc; --accent-soft:#223249; --brass:#d2ad62;
  --ok:#6fcf9b; --ok-soft:#173327; --bad:#ef8a83; --bad-soft:#3a1f1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121822; --surface:#1a2230; --ink:#e6eaf0; --muted:#9aa5b5; --line:#2f3a4b;
  --accent:#8fb0dc; --accent-soft:#223249; --brass:#d2ad62;
  --ok:#6fcf9b; --ok-soft:#173327; --bad:#ef8a83; --bad-soft:#3a1f1e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.25;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.staff{height:17px;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 4px);margin-top:14px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:10px 14px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:6px 14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.progress{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .3s}
.qno{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--brass)}
.listen{display:flex;flex-direction:column;gap:8px}
.listen .btn.primary{font-size:1.05rem;padding:14px}
.note{font-size:.82rem;color:var(--muted);margin:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{justify-content:flex-start;text-align:left;padding:12px 14px;gap:12px;line-height:1.4}
.choices button b{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted)}
.choices button.correct{background:var(--ok-soft);border-color:var(--ok)}
.choices button.correct b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choices button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.choices button.wrong b{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.choices button:disabled{cursor:default;opacity:1;color:var(--ink)}
.feedback{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.meta{font-size:.85rem;color:var(--muted)}
.feedback p{margin:0}
.score{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.2rem;color:var(--muted)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.plain li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
ul.plain li:last-child{border-bottom:0}
ul.plain .n{flex:none;width:28px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
ul.plain .t{flex:1;min-width:0}
ul.plain .t small{display:block;color:var(--muted);font-size:.8rem}
ul.plain a{flex:none;color:var(--accent);font-size:.85rem;font-weight:500}
.era{font-family:var(--display);font-size:1.1rem;margin:8px 0 0;color:var(--brass)}
.player{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:var(--ink)}
.player #yt,.player iframe{position:absolute;inset:0;width:100%;height:100%}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--surface);text-align:center;padding:16px}
.cover strong{font-family:var(--display);font-size:1.4rem}
.cover span{font-size:.85rem;opacity:.85}
.peek{font-size:.85rem;color:var(--muted);min-height:38px;padding:6px 12px;align-self:flex-start}
.peek[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.eq{display:flex;gap:4px;align-items:flex-end;height:28px}
.eq i{width:5px;background:var(--surface);height:6px;border-radius:2px}
.playing .eq i{animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
@keyframes eq{0%,100%{height:6px}50%{height:28px}}
@media (prefers-reduced-motion:reduce){.playing .eq i{animation:none;height:18px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>서양음악사 리스닝 퀴즈</h1>
    <p>수업 감상곡 49곡 · 듣고 4지선다로 고르기</p>
    <div class="staff" aria-hidden="true"></div>
  </header>

  <nav class="tabs">
    <button id="tab-quiz" aria-pressed="true">퀴즈</button>
    <button id="tab-list" aria-pressed="false">곡 목록 공부</button>
  </nav>

  <section id="view-setup" class="card">
    <div>
      <div class="label">문제 수</div>
      <div class="row" id="count-row" style="margin-top:8px"></div>
    </div>
    <div>
      <div class="label">범위</div>
      <div class="row" id="era-row" style="margin-top:8px"></div>
    </div>
    <p class="note">'듣기'를 누르면 곡의 여러 구간 중 하나가 랜덤으로 30초 재생돼요. 화면은 가려져 있고, 답을 고르면 영상이 보여요.</p>
    <div class="row">
      <button class="primary" id="start" style="flex:1">시작하기</button>
      <button id="retry-wrong" hidden>틀린 문제만 (<span id="wrong-count">0</span>)</button>
    </div>
  </section>

  <section id="view-q" class="card" hidden>
    <div>
      <div class="progress"><span id="prog-text"></span><span id="score-live"></span></div>
      <div class="bar" style="margin-top:6px"><i id="bar"></i></div>
    </div>
    <div class="qno" id="qno"></div>
    <div class="listen">
      <div class="player" id="player-box"><div id="yt"></div><div class="cover" id="cover"><div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><strong>소리만 듣고 맞혀보세요</strong><span id="cover-sub">답을 고르면 영상이 보여요</span></div></div>
      <div class="row"><button class="primary" id="play" style="flex:1">▶ 듣기</button><button id="stop">정지</button><button id="other">다른 구간</button></div>
      <button id="peek" class="peek">광고가 나오면: 화면 잠깐 보기</button>
      <p class="note" id="listen-note"></p>
    </div>
    <div class="label">이 곡은?</div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" hidden>
      <div class="verdict" id="verdict"></div>
      <div class="meta" id="meta"></div>
      <p id="explain"></p>
      <button class="primary" id="next" style="margin-top:8px">다음 문제</button>
    </div>
  </section>

  <section id="view-result" class="card" hidden>
    <div class="label">결과</div>
    <div class="score" id="score"></div>
    <p class="meta" id="result-msg" style="margin:0"></p>
    <div id="wrong-wrap">
      <div class="label">틀린 곡</div>
      <ul class="plain" id="wrong-list"></ul>
    </div>
    <div class="row">
      <button class="primary" id="again" style="flex:1">처음 화면으로</button>
      <button id="again-wrong">틀린 문제 다시</button>
    </div>
  </section>

  <section id="view-list" class="card" hidden>
    <p class="note">곡마다 시대·장르와 듣고 구별하는 포인트를 정리했어요. '듣기'는 퀴즈와 같은 지점부터 열려요.</p>
    <div id="list"></div>
  </section>
</div>

<script>
const E={M:"중세",R:"르네상스",B:"바로크",C:"고전"};
// [no, id(video), start sec, title, era, genre, clue, confusers]
const D=[
[1,"Vj7R9LeiJPE",[0, 90, 180],"그레고리오 성가 ‘Dies Irae’","M","단선율 성가","반주 없이 남성들이 한 선율을 함께 부름(단성음악). 박이 일정하지 않고 라틴어 가사를 따라 흘러감.",[2,3,34]],
[2,"FNbIyFlvxlk",[0, 100, 180],"Josquin des Prez ‘Ave Maria’","R","모테트","무반주 합창인데 성부들이 같은 선율을 차례로 따라 들어옴(모방 대위법). 성가보다 훨씬 겹겹이 들림.",[1,3,4]],
[3,"ccg8tj-nKBg",[60, 600, 1500, 2400],"이탈리아 마드리갈","R","세속 성악곡","무반주 여러 성부, 이탈리아어. 가사 뜻을 음으로 그리는 표현(가사 그리기)이 많고 모테트보다 감정이 극적임.",[2,4,1]],
[4,"g21hYxQvgMs",[0, 139],"G. Caccini ‘Amarilli, mia bella’","B","모노디(초기 바로크 독창곡)","한 사람의 노래 + 류트/건반의 단순한 반주(통주저음). 여러 성부가 아니라 독창 하나가 중심.",[3,9,10]],
[5,"ZPdk5GaIDjo",[0, 62, 170],"Vivaldi 〈사계〉 ‘겨울’ 1악장","B","바이올린 협주곡","단조. 현악기가 같은 음을 날카롭게 반복하며 떨림(추위에 이가 덜덜). 불협화음이 쌓이며 시작.",[6,7,12]],
[6,"PapzGRO9edU",[0, 80],"Vivaldi 〈사계〉 ‘가을’ 3악장","B","바이올린 협주곡","장조, 3박자의 경쾌한 사냥 음악. 호른 소리를 흉내 낸 선율과 쫓기는 듯 빠른 바이올린.",[5,7,29]],
[7,"3LiztfE1X7E",[0, 101],"Vivaldi 〈사계〉 ‘봄’ 1악장","B","바이올린 협주곡","밝은 E장조 주제(리토르넬로)로 시작, 곧 바이올린들이 트릴로 새소리를 흉내 냄.",[5,6,33]],
[8,"LFBIJgkj_-g",[0, 90],"Handel 〈메시아〉 ‘For Unto Us a Child is Born’","B","오라토리오 합창","영어 합창. 한 음절을 길게 굴리는 빠른 멜리스마, 그리고 ‘Wonderful, Counsellor’에서 합창 전체가 힘차게 외침.",[34,14,49]],
[9,"KxnBjAaJWCc",[0, 60],"Handel 〈리날도〉 ‘Lascia ch’io pianga’","B","오페라 아리아","느린 3박자(사라방드), 2박째에 무게가 실리는 리듬. 소프라노가 단순하고 애절하게 부름.",[10,4,13]],
[10,"N7XH-58eB8c",[0, 144],"Handel 〈세르세〉 ‘Ombra mai fu’","B","오페라 아리아","‘헨델의 라르고’. 현악의 부드러운 도입 뒤 긴 음을 길게 끄는 아주 느린 노래. 원래 카스트라토 배역.",[9,4,15]],
[11,"1yyBP3t7g90",[0, 99],"D. Scarlatti 하프시코드 소나타 K.141","B","건반 소나타","하프시코드 독주. 한 음을 기관총처럼 빠르게 연타(반복음)하고 기타를 긁는 듯한 화음.",[16,18,20]],
[12,"xw-H_BpcOPk",[0, 200, 420],"Bach 〈브란덴부르크 협주곡 5번〉","B","합주 협주곡","플루트·바이올린·하프시코드가 독주 그룹. 하프시코드가 반주가 아니라 주인공으로 화려하게 달림.",[17,5,15]],
[13,"yc_btdk-_d4",[871, 960],"Bach 칸타타 BWV 208 ‘Sheep May Safely Graze’","B","칸타타 아리아","리코더 두 대의 목가적인 반주 위에 소프라노. 느긋하고 평화로운 분위기.",[14,9,15]],
[14,"WUo7tQOvapE",[0, 105],"Bach 칸타타 BWV 147 ‘Jesu, Joy of Man’s Desiring’","B","칸타타 코랄","셋잇단음표로 끊임없이 흐르는 기악 선율 위에, 합창이 느린 찬송가(코랄)를 부름.",[13,8,15]],
[15,"pzlw6fUux4o",[0, 189],"Bach ‘G선상의 아리아’ BWV 1068","B","관현악 모음곡","느린 현악. 위에서는 긴 음이 길게 이어지고, 아래 베이스는 옥타브로 또박또박 걸어감.",[10,17,43]],
[16,"iWoI8vmE8bI",[0, 60],"Bach 〈평균율〉 1권 1번 C장조 전주곡","B","건반 전주곡","선율 없이 같은 모양의 분산화음 패턴만 반복되며 화음이 바뀜. 구노 ‘아베 마리아’의 반주로도 유명.",[18,11,19]],
[17,"fzUdwPqB3hs",[0, 120, 240],"Bach 〈두 대의 바이올린을 위한 협주곡〉 2악장","B","협주곡","느린 12/8박자. 두 바이올린이 한 선율을 주고받으며 대화하듯 엇갈림.",[15,12,36]],
[18,"seYfmj3L2EA",[0, 138],"Bach 〈골드베르크 변주곡〉 아리아","B","건반 변주곡","느린 3박자 건반 독주, 꾸밈음(장식음)이 아주 많은 섬세한 선율.",[16,11,40]],
[19,"mGQLXRTl3Z0",[0, 60],"Bach 〈무반주 첼로 모음곡 1번〉 전주곡","B","무반주 모음곡","첼로 한 대뿐. G장조 분산화음이 물결치듯 반복됨.",[16,28,15]],
[20,"Nnuq9PXbywA",[0, 60, 180],"Bach 〈토카타와 푸가 d단조〉","B","오르간곡","파이프 오르간. 높은 음에서 꾸밈음 후 아래로 쏟아지는 강렬한 단조 도입.",[11,1,44]],
[21,"aYnU-CaH0bM",[180, 300],"A. Marcello 〈오보에 협주곡〉 2악장","B","협주곡","오보에의 느리고 구슬픈 d단조 선율, 현악은 조용히 반복 화음으로 받침.",[43,15,10]],
[22,"ZCdK5mIxrpg",[0, 40],"Clementi 〈소나티네 Op.36 No.1〉","C","피아노 소나티네","C장조, 아주 단순한 도-미-솔 화음을 오르내리는 행진곡풍 주제. 피아노 학원 필수곡.",[23,40,30]],
[23,"hgbmyup85CE",[0, 100],"Kuhlau 〈소나티네 Op.20 No.1〉","C","피아노 소나티네","C장조, 화음을 힘차게 친 뒤 빠른 음계·아르페지오로 달림. 클레멘티보다 더 화려함.",[22,40,41]],
[24,"VOLy6JxEDLw",[0, 60, 150],"Haydn 교향곡 94번 ‘놀람’ 2악장","C","교향곡","아주 조용하고 단순한 주제를 반복하다 갑자기 ‘쾅’ 하는 큰 화음.",[25,33,27]],

const S=D.map(d=>({no:d[0],vid:d[1],t:d[2],title:d[3],era:d[4],genre:d[5],clue:d[6],conf:d[7]}));
const byNo=Object.fromEntries(S.map(s=>[s.no,s]));
const $=id=>document.getElementById(id);
const url=(s,t=s.t[0])=>`https://www.youtube.com/watch?v=${s.vid}${t?`&t=${t}s`:""}`;
let pt=0;
const fmt=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let count=20, era="all", queue=[], idx=0, score=0, wrongs=[];
const store={get(){try{return JSON.parse(localStorage.getItem("mh-wrong")||"[]")}catch(e){return[]}},
  set(v){try{localStorage.setItem("mh-wrong",JSON.stringify(v))}catch(e){}}};

function chips(rowId,opts,cur,cb){const row=$(rowId);row.innerHTML="";
  opts.forEach(([v,l])=>{const b=document.createElement("button");b.className="chip";b.textContent=l;
    b.setAttribute("aria-pressed",v===cur);b.onclick=()=>{cb(v);[...row.children].forEach(c=>c.setAttribute("aria-pressed",c===b))};row.appendChild(b)})}
chips("count-row",[[10,"10문제"],[20,"20문제"],[49,"전체 49"]],count,v=>count=v);
chips("era-row",[["all","전체"],["MRB","중세~바로크"],["C","고전"]],era,v=>era=v);

function show(v){["setup","q","result","list"].forEach(k=>$("view-"+k).hidden=k!==v)}
function refreshWrong(){const w=store.get();$("wrong-count").textContent=w.length;$("retry-wrong").hidden=!w.length}

function makeChoices(s){
  let pool=s.conf.filter(n=>byNo[n]);
  const others=shuffle(S.filter(x=>x.no!==s.no&&!pool.includes(x.no)&&x.era===s.era).map(x=>x.no));
  pool=shuffle(pool).slice(0,3);
  while(pool.length<3)pool.push(others.shift());
  return shuffle([s.no,...pool]).map(n=>byNo[n]);
}
function start(list){queue=shuffle(list);idx=0;score=0;wrongs=[];show("q");render()}
function render(){
  const s=queue[idx];
  $("prog-text").textContent=`${idx+1} / ${queue.length}`;
  $("score-live").textContent=`맞힌 수 ${score}`;
  $("bar").style.width=`${idx/queue.length*100}%`;
  $("qno").textContent=`Q${idx+1}.`;
  pt=Math.floor(Math.random()*s.t.length);answered=false;$("cover").hidden=false;setPeek(false);$("peek").hidden=false;if(ready)player.stopVideo();setListen(s);
  $("other").hidden=s.t.length<2;
  $("feedback").hidden=true;
  const box=$("choices");box.innerHTML="";
  makeChoices(s).forEach((c,i)=>{const b=document.createElement("button");
    b.innerHTML=`<b>${"①②③④"[i]}</b><span></span>`;b.querySelector("span").textContent=c.title;
    b.onclick=()=>answer(s,c,b);b.dataset.no=c.no;box.appendChild(b)});
}
const CLIP=30;let player=null,ready=false,timer=null,failed=false;
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player("yt",{width:"100%",height:"100%",
  playerVars:{controls:0,disablekb:1,rel:0,playsinline:1,fs:0,iv_load_policy:3,origin:location.origin},
  events:{onReady:()=>{ready=true},onStateChange:onState,onError:onErr}})};
function clip(){const s=queue[idx],t=s.t[pt];return{videoId:s.vid,startSeconds:t,endSeconds:t+CLIP}}
function note(){const s=queue[idx];$("listen-note").textContent=`구간 ${pt+1}/${s.t.length} · ${CLIP}초 재생`}
function setListen(s){failed=false;note();if(ready)player.cueVideoById(clip())}
function onState(e){const box=$("player-box");clearInterval(timer);
  if(e.data===YT.PlayerState.PLAYING){box.classList.add("playing");timer=setInterval(()=>{if(failed)return;const c=clip();
    const el=Math.max(0,Math.round(player.getCurrentTime()-c.startSeconds));$("listen-note").textContent=`재생 중 ${fmt(Math.min(el,CLIP))} / ${fmt(CLIP)} · 구간 ${pt+1}/${queue[idx].t.length}`},500)}
  else{box.classList.remove("playing");if(e.data===YT.PlayerState.ENDED)$("listen-note").textContent="재생이 끝났어요. 다시 들으려면 '듣기'를 누르세요."}}
function onErr(){failed=true;const s=queue[idx];$("listen-note").innerHTML="";const a=document.createElement("a");a.href=url(s,s.t[pt]);a.target="_blank";a.rel="noopener";
  a.textContent="이 영상은 여기서 재생이 안 돼요. 유튜브에서 열기";a.style.color="var(--accent)";$("listen-note").appendChild(a)}
$("play").onclick=()=>{if(!ready){$("listen-note").textContent="플레이어를 불러오는 중이에요. 잠시 후 다시 눌러주세요.";return}player.loadVideoById(clip())};
let answered=false;
function setPeek(on){$("peek").setAttribute("aria-pressed",on);$("peek").textContent=on?"다시 가리기":"광고가 나오면: 화면 잠깐 보기";if(!answered)$("cover").hidden=on}
$("peek").onclick=()=>setPeek($("peek").getAttribute("aria-pressed")!=="true");
$("stop").onclick=()=>{if(ready)player.pauseVideo()};
$("other").onclick=()=>{const s=queue[idx];pt=(pt+1)%s.t.length;setListen(s);if(ready)player.loadVideoById(clip())};
function answer(s,c,btn){
  const ok=c.no===s.no;
  [...$("choices").children].forEach(b=>{b.disabled=true;if(+b.dataset.no===s.no)b.classList.add("correct")});
  if(!ok)btn.classList.add("wrong");
  if(ok)score++;else wrongs.push(s);
  const w=new Set(store.get());ok?w.delete(s.no):w.add(s.no);store.set([...w]);
  $("verdict").textContent=ok?"정답이에요!":"아쉬워요. 정답은 아래 곡이에요.";
  $("verdict").className="verdict "+(ok?"ok":"bad");
  $("meta").textContent=`${s.title} · ${E[s.era]} · ${s.genre}`;
  $("explain").textContent="구별 포인트: "+s.clue;
  $("score-live").textContent=`맞힌 수 ${score}`;
  $("next").textContent=idx===queue.length-1?"결과 보기":"다음 문제";
  $("feedback").hidden=false;answered=true;$("cover").hidden=true;$("peek").hidden=true;$("next").focus();
}
$("next").onclick=()=>{if(ready)player.stopVideo();idx++;if(idx<queue.length)render();else finish()};
function finish(){
  show("result");refreshWrong();
  $("score").innerHTML=`${score}<small> / ${queue.length}</small>`;
  const r=score/queue.length;
  $("result-msg").textContent=r===1?"전부 맞혔어요. 실전도 이대로만!":r>=.8?"거의 다 왔어요. 틀린 곡만 한 번 더 들어보세요.":r>=.5?"절반 넘게 맞혔어요. 곡 목록에서 구별 포인트를 복습해 보세요.":"아직 헷갈리는 곡이 많아요. 곡 목록에서 하나씩 들어보고 다시 도전해 보세요.";
  $("wrong-wrap").hidden=!wrongs.length;$("again-wrong").hidden=!wrongs.length;
  const ul=$("wrong-list");ul.innerHTML="";
  wrongs.forEach(s=>ul.appendChild(item(s)));
}
function item(s){const li=document.createElement("li");
  li.innerHTML=`<span class="n">${s.no}</span><span class="t"></span><a target="_blank" rel="noopener">듣기</a>`;
  const t=li.querySelector(".t");t.textContent=s.title;const sm=document.createElement("small");sm.textContent=`${s.genre} · ${s.clue}`;t.appendChild(sm);
  li.querySelector("a").href=url(s);return li}
function buildList(){const box=$("list");box.innerHTML="";
  ["M","R","B","C"].forEach(e=>{const h=document.createElement("h2");h.className="era";h.textContent=E[e];box.appendChild(h);
    const ul=document.createElement("ul");ul.className="plain";S.filter(s=>s.era===e).forEach(s=>ul.appendChild(item(s)));box.appendChild(ul)})}

$("start").onclick=()=>{let l=S.filter(s=>era==="all"||(era==="C"?s.era==="C":s.era!=="C"));start(shuffle(l).slice(0,Math.min(count,l.length)))};
$("retry-wrong").onclick=()=>start(store.get().map(n=>byNo[n]).filter(Boolean));
$("again-wrong").onclick=()=>start(wrongs.slice());
$("tab-list").addEventListener("click",()=>{if(ready)player.stopVideo()});
$("again").onclick=()=>{show("setup");refreshWrong()};
$("tab-quiz").onclick=()=>{$("tab-quiz").setAttribute("aria-pressed",true);$("tab-list").setAttribute("aria-pressed",false);show("setup");refreshWrong()};
$("tab-list").onclick=()=>{$("tab-list").setAttribute("aria-pressed",true);$("tab-quiz").setAttribute("aria-pressed",false);show("list")};
buildList();refreshWrong();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
